    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Control Hub</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-color: #f0f2f5;
                color: #333;
            }
            .container {
                text-align: center;
                background: #fff;
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            }
            h1 {
                font-size: 28px;
                margin-bottom: 30px;
                color: #1a73e8;
            }
            .control-group {
                margin-bottom: 25px;
            }
            .control-group h2 {
                font-size: 20px;
                margin-bottom: 15px;
                color: #555;
            }
            .btn {
                padding: 12px 24px;
                font-size: 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.3s ease;
                margin: 5px;
                min-width: 120px;
            }
            .btn-start {
                background-color: #4CAF50;
                color: white;
            }
            .btn-start:hover {
                background-color: #45a049;
            }
            .btn-stop {
                background-color: #f44336;
                color: white;
            }
            .btn-stop:hover {
                background-color: #e53935;
            }
            .btn:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }
            .status {
                margin-top: 10px;
                font-size: 14px;
                color: #666;
                height: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>AI Control Hub</h1>

            <div class="control-group">
                <h2>Hand Gesture Control</h2>
                <button id="start-hand" class="btn btn-start" onclick="toggleScript('hand', 'start')">Start</button>
                <button id="stop-hand" class="btn btn-stop" onclick="toggleScript('hand', 'stop')" disabled>Stop</button>
                <div id="status-hand" class="status">Status: Inactive</div>
            </div>

            <div class="control-group">
                <h2>Voice Gesture Control</h2>
                <button id="start-voice" class="btn btn-start" onclick="toggleScript('voice', 'start')">Start</button>
                <button id="stop-voice" class="btn btn-stop" onclick="toggleScript('voice', 'stop')" disabled>Stop</button>
                <div id="status-voice" class="status">Status: Inactive</div>
            </div>
        </div>

        <script>
            function toggleScript(script, action) {
                fetch(`/${action}/${script}`)
                    .then(response => response.json())
                    .then(data => {
                        console.log(data.status);
                        updateStatus();
                    });
            }

            function updateStatus() {
                fetch('/status')
                    .then(response => response.json())
                    .then(data => {
                        // Hand Gesture Status
                        const handRunning = data.hand;
                        document.getElementById('start-hand').disabled = handRunning;
                        document.getElementById('stop-hand').disabled = !handRunning;
                        document.getElementById('status-hand').textContent = `Status: ${handRunning ? 'Active' : 'Inactive'}`;

                        // Voice Gesture Status
                        const voiceRunning = data.voice;
                        document.getElementById('start-voice').disabled = voiceRunning;
                        document.getElementById('stop-voice').disabled = !voiceRunning;
                        document.getElementById('status-voice').textContent = `Status: ${voiceRunning ? 'Active' : 'Inactive'}`;
                    });
            }

            // Initial status update when the page loads
            window.onload = updateStatus;
            // Periodically update status
            setInterval(updateStatus, 3000);
        </script>
    </body>
    </html>
